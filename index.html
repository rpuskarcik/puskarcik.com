<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puskarcik Family Database</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; width: 80px; font-size: 16px; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; background: #fafafa; }
        .card h2 { margin-top: 0; }
        .field { margin-bottom: 8px; }
        .label { font-weight: bold; }
    </style>
</head>
<body>

    <h1>Family Database Browser</h1>

    <div class="controls">
        <label for="personId">ID (1-64):</label>
        <input type="number" id="personId" value="15" min="1" max="64">
        <button id="loadBtn">Load Profile</button>
    </div>

    <div id="profile" class="card">
        Loading...
    </div>

    <script src="/frontend/script.js"></script>
</body>
</html>
